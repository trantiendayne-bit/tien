<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Cà Phê Máy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        #product-list {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 20px;
        }

        .product img {
            width: 160px;
            height: 140px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .product h4 {
            font-size: 13px;
            margin: 5px 0;
        }

        .product p {
            font-size: 12px;
            color: #777;
            margin: 0;
        }

       #product-list {
    display: grid;
    grid-template-columns: repeat(3, 180px);
    gap: 20px;
}

.product {
    width: 180px;
}

.product img {
    display: block;
    width: 180px;
    height: 150px;
    object-fit: cover;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
}
    </style>
</head>
<body>
    <h3>Cà Phê Máy</h3>

    <div id="product-list"></div>

    <script type="module" src="./index.js"></script>
</body>
</html>
