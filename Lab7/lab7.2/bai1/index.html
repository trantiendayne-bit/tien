
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 25px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 7px 12px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .add {
            background: #198754;
            color: white;
        }

        .edit {
            background: #ffc107;
        }

        .delete {
            background: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        tr:hover {
            background: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>Quản lý sản phẩm</h2>

    <form id="productForm">
        <input type="hidden" id="id">

        <input type="text" id="name"
            placeholder="Tên sản phẩm" required>

        <input type="number" id="price"
            placeholder="Giá sản phẩm" min="0" required>

        <input type="number" id="quantity"
            placeholder="Số lượng" min="0" required>

        <button type="submit" class="add" id="submitBtn">
            Thêm sản phẩm
        </button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Chức năng</th>
            </tr>
        </thead>

        <tbody id="productList"></tbody>
    </table>

    <script type="module" src="./index.js"></script>
</body>
</html>
